<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Diabetes Prediction|Password_change</title>

    <link
      href="//maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
      rel="stylesheet"
      id="bootstrap-css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css" />

    <style>
      .content {
        width: 50%;
        margin-left: 330px;
        margin-bottom: 20px;
        border: 5px inset pink;
        border-radius: 5px;
      }
      .form {
        padding: 24px;
        margin: 20px 0px;
      }
      .wrong_pass {
        color: red;
        background-color: yellow;
      }
      .correct_pass {
        color: green;
        background-color: yellow;
      }
      .btn-group-vertical {
        height: 100%;
      }
      .btn {
        font-size: 20px;
      }
      .img {
        opacity: 0.4;
        position: absolute;
        width: 100%;
        height: 100%;
        background-size: cover;
      }
      .last {
        position: relative;
      }

      .float-right {
        height: 30px;
        width: 140px;
      }
      body {
        background-image: url("/static/img/dia_6.avif");
        margin: 0px 0px 0px 0px;
        box-sizing: border-box;
        background-repeat: no-repeat;
        width: 100%;
        background-size: cover;
        backdrop-filter: blur(5px);
      }
      header {
        margin-top: -10px;
      }

      .list {
        display: flex;
        justify-content: space-evenly;

        background: rgba(120, 245, 69, 0.25);
        border-radius: 5px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        border: 1px solid rgba(120, 245, 69, 0.09);

        margin-top: 20px;
        list-style-type: none;
        font-size: 23px;
        font-family: serif;
        text-decoration: none;
      }

      .li:hover {
        background-color: yellow;
      }

      .li {
        margin-right: 4%;
      }

      a {
        text-decoration: none;
      }

      .ind_tuber {
        width: 91%;
        text-align: center;
        margin-left: 4.5%;
        margin-top: 3%;
        font-size: 30px;
        font-weight: 600;

        background: rgba(50, 248, 113, 0.26);
        border-radius: 16px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(0.5px);
        -webkit-backdrop-filter: blur(0.5px);
        border: 2px solid black;
      }
    </style>
  </head>
  <body>
    <div class="body">
      <h1 class="ind_tuber">
        DIABETES PREDICTION <br />
        USING DIFFERENT MACHINE LEARNING APPROCHESS
      </h1>
      <div class="last">
        <header>
          <div class="container">
            <div class="toggle"><i class="fa fa-bars"></i></div>
            <nav>
              <ul class="list">
                <div class="close"><i class="fa fa-times"></i></div>
                <li class="li"><a href="\index">Home</a></li>

                <li class="li">
                  <a class="li" href="\prediction">Prediction</a>
                </li>
                <li class="li"><a href="\graphs">Graphs</a></li>
                <li class="li"><a href="#active">Change Password </a></li>

                <li class="li">
                  <a href="\logout" style="text-decoration: non">Logout</a>
                </li>
              </ul>
            </nav>

            <div style="clear: both"></div>
          </div>
        </header>

        <div class="content">
          <div class="card card-outline-secondary">
            <div class="card-header">
              <h2 class="mb-12 cp"><b>Change Password</b></h2>
            </div>
            <h5 class="correct_pass">{{msg1}}</h5>
            <h5 class="wrong_pass">{{msg2}}</h5>
            <h5 class="wrong_pass">{{msg3}}</h5>
            <div class="card-body">
              <form method="post" class="form" role="form" autocomplete="off">
                <div class="form-group">
                  <label for="inputPasswordOld">Current Password:</label>
                  <input
                    type="password"
                    name="current"
                    class="form-control"
                    id="inputPasswordOld"
                    required=""
                  />
                </div>

                <div class="form-group">
                  <label for="inputPasswordNew">New Password:</label>
                  <input
                    type="password"
                    name="new"
                    class="form-control"
                    id="inputPasswordNew"
                    required=""
                  />
                  <span class="form-text small text-muted">
                    The password must be 8-20 characters, and must
                    <em>not</em> contain spaces.
                  </span>
                </div>

                <div class="form-group">
                  <label for="inputPasswordNewVerify">Re-enter:</label>
                  <input
                    type="password"
                    name="verify"
                    class="form-control"
                    id="inputPasswordNewVerify"
                    required=""
                  />
                  <span class="form-text small text-muted">
                    To confirm, type the new password again.
                  </span>
                </div>

                <div class="form-group">
                  <button type="submit" class="btn-success float-right">
                    Save
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
