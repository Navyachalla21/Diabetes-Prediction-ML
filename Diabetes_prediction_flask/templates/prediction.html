<form action="\predict" method="post"  enctype="multipart/form-data">

    <h1><bold>DIABETES PREDICTION</bold></h1>
    <h4>Enter the Answer for all the question</h4>
    <hr><br>
   <div class="questions">
       

    <label for="q1">1) Enter the value of Pregnancies [0 - 17] : </label>

    <input type="number" id="q1" name="q1" min="0" max="17" placeholder = " Pregnancies between 0 - 17 " > 

    <br>

    <label for="q2">2) Enter the value of Glucose [0 - 199] : </label>

    <input type="number" id="q2" name="q2" min="0" max="199" placeholder = " Glucose between 0 - 199 " > 

    <br>

    <label for="q3">3) Enter the value of BloodPressure [0 - 122] :   </label>

    <input type="number" id="q3" name="q3" min="0" max="122" placeholder = " BloodPressure between 0 - 122 " > 

    <br>

    <label for="q4">4) Enter the value of SkinThickness [0 - 99] : </label>

    <input type="number" id="q4" name="q4" min="0" max="99" placeholder = " SkinThickness between 0 - 99 " > 

    <br>

    <label for="q5">5) Enter the value of Insulin [0 - 846] : </label>

    <input type="number" id="q5" name="q5" min="0" max="846" placeholder = " Insulin between 0 - 846 " > 

    <br>

    <label for="q6">6) Enter the value of BMI [0.0 - 67.1] : </label>

    <input type="number" step="0.1" id="q6" name="q6" min="0" max="99" placeholder = " BMI between 0.0 - 67.1 " > 

    <br>

    <label for="q7">7) Enter the value of DiabetesPedigreeFunction [0.078 - 2.42] : </label>

    <input type="number" step="0.001" id="q7" name="q7" min="0.078" max="2.42" placeholder = "DBF between 0.078 - 2.42" >

    <br>

    <label for="q8">8) Enter the value of Age [21 - 81] : </label>

    <input type="number" step="0.01" id="q8" name="q8" min="21" max="81" placeholder = "Age between 21 to 81" >
