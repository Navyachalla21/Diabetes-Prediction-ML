<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Diabetes predicton|Register</title>
    <link
      href="//maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
      rel="stylesheet"
      id="bootstrap-css"
    />

    <link rel="stylesheet" href="/static/styles.css" />

    <style>
      body {
        background-image: url("/static/img/dia_3.png");
        margin: 0px 0px 0px 0px;
        box-sizing: border-box;
        background-repeat: no-repeat;
        width: 100%;
        background-size: cover;
        backdrop-filter: blur(5px);
      }
      .error_mail {
        color: red;
      }

      .body {
        overflow: hidden;
        position: relative;
      }
      .img {
        opacity: 0.4;
        position: absolute;
        width: 100%;
        height: 100%;
      }
      .last {
        position: relative;
      }
    </style>
  </head>
  <body>
    <div class="body">
      <div class="last">
        <h1 class="tuber">
          DIABETES PREDICTION <br />
          USING DIFFERENT MACHINE LEARNING APPROCHESS
        </h1>

        <div class="container">
          <h2 class="text-center">
            <a href="http://bootstrap-ecommerce.com/"> </a>
          </h2>
          <hr />

          <div class="row justify-content-right">
            <div class="col-md-6">
              <div class="r_card">
                <header class="card-header">
                  <a href="/" class="float-right btn btn-outline-primary mt-1"
                    >Log in</a
                  >
                  <h4 class="card-title mt-2">Sign up</h4>
                </header>
                <article class="card-body">
                  <form method="post">
                    <div class="form-row">
                      <div class="col form-group">
                        <label>First name </label>
                        <input
                          type="text"
                          class="form-control"
                          name="name"
                          placeholder="Enter your name"
                          required
                        />
                      </div>
                      <!-- form-group end.// -->
                      <div class="col form-group">
                        <label>Last name</label>
                        <input
                          type="text"
                          class="form-control"
                          name="Last name"
                          placeholder="Enter your last name"
                          required
                        />
                      </div>
                      <!-- form-group end.// -->
                    </div>
                    <!-- form-row end.// -->
                    <div class="form-group">
                      <label>Email address</label>
                      <input
                        type="email"
                        class="form-control"
                        name="Email"
                        placeholder=""
                        required
                      />
                      <small class="form-text text-muted"
                        >We'll never share your email with anyone else.</small
                      >
                      <h5 class="error_mail">{{msg}}</h5>
                    </div>
                    <!-- form-group end.// -->
                    <div class="form-group">
                      <label class="form-check form-check-inline">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="gender"
                          value="option1"
                        />
                        <span class="form-check-label"> Male </span>
                      </label>
                      <label class="form-check form-check-inline">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="gender"
                          value="option2"
                          required
                        />
                        <span class="form-check-label"> Female</span>
                      </label>
                    </div>
                    <!-- form-group end.// -->
                    <div class="form-row">
                      <!-- form-group end.// -->
                      <div class="form-group col-md-6"></div>
                      <!-- form-group end.// -->
                    </div>
                    <!-- form-row.// -->
                    <div class="form-group" style="margin-top: -25px">
                      <label>Create password</label>
                      <input
                        class="form-control"
                        name="Password"
                        type="password"
                        required
                      />
                    </div>
                    <!-- form-group end.// -->
                    <div class="form-group">
                      <button type="submit" class="btn btn-primary btn-block">
                        Register
                      </button>
                    </div>
                    <!-- form-group// -->
                    <small class="text-muted"
                      >By clicking the 'Sign Up' button, you confirm that you
                      accept our <br />
                      Terms of use and Privacy Policy.</small
                    >
                  </form>
                </article>
                <!-- card-body end .// -->
                <div
                  class="border-top card-body text-center"
                  style="margin-top: -25px"
                >
                  Have an account? <a href="/">Log In</a>
                </div>
              </div>
              <!-- card.// -->
            </div>
            <!-- col.//-->
          </div>
          <!-- row.//-->
        </div>
        <!--container end.//-->
      </div>
    </div>
    <script src="//maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  </body>
</html>
